include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "packages/**"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # Nova is an app, not a published package; doc comments are required in
    # nova_core (see its own analysis_options.yaml) but not on every widget.
    public_member_api_docs: false
