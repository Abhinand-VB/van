name: van
description: >-
  A proactive accountability companion. Van does not just store what you meant
  to do - it notices when a planned work session did not start, and responds.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  android_alarm_manager_plus: ^5.1.1
  cupertino_icons: ^1.0.8
  drift: ^2.34.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  flutter_timezone: ^5.1.0
  meta: ^1.17.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.6.0+eol
  # The pure domain core. No Flutter, no I/O, no ambient time - see
  # docs/ARCHITECTURE.md P1. Kept a separate package so the boundary is
  # enforced by the dependency graph rather than by convention.
  timezone: ^0.11.1
  van_core:
    path: packages/van_core

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  # Used by the measurement-timeout test, which asserts behaviour at five
  # minutes. Real delays there would cost the suite six minutes to prove one
  # thing, and a test that slow gets deleted rather than kept honest.
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  # Used only by the migration test, which builds a schema-v1 database by hand
  # so the upgrade is proven against the shape actually on the phone.
  sqlite3: ^3.5.1
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/prompts/
    - assets/nudge_templates/
    - assets/inference_config.json
    - assets/policy.json
    # The golden set, shipped so `GoldenRunScreen` can measure the on-device
    # model against exactly the cases CI measures the parser against. Reading
    # the same file rather than a copy is the whole point: a gate evaluated
    # against a second, drifting copy of the cases gates nothing.
    - test/golden/extract_task.json
    # The golden set, shipped so `GoldenRunScreen` can measure the on-device
    # model against exactly the cases CI measures the parser against. Reading
    # the same file rather than a copy is the whole point: a gate evaluated
    # against a second, drifting copy of the cases gates nothing.
    - test/golden/extract_task.json
