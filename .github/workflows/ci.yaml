name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          dart pub get --directory packages/nova_core

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      # The architectural rules in docs/ARCHITECTURE.md are only real because
      # this step fails the build when they are broken.
      - name: Architectural fitness check
        run: dart run tool/check_layers.dart

      - name: Core tests (pure Dart, no Flutter)
        run: dart test
        working-directory: packages/nova_core

      - name: App tests
        run: flutter test
